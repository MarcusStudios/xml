<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Identificar NF do XML na planilha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader" class="loader-wrap" hidden>
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loaderText">Carregando...</div>
</div>
<main>
<h1>A qual NF da planilha este XML pertence?</h1>
<p class="sub">Para cada XML, o app lê a chave de acesso e o valor total (vNF) e procura os dois na planilha. Nada sai do seu navegador.</p>

<section class="panel">
<div class="panel-header">
  <i class="ph ph-file-code"></i>
  <h2>1. XMLs das notas</h2>
</div>
<label class="dropzone" id="dzXml">
  <i class="ph ph-upload-simple"></i>
  <span>Clique para selecionar ou arraste os XMLs aqui</span>
  <input type="file" id="xmlFiles" accept=".xml" multiple hidden>
</label>
<div class="info" id="xmlInfo">Nenhum arquivo lido ainda.</div>
</section>

<section class="panel">
<div class="panel-header">
  <i class="ph ph-file-xls"></i>
  <h2>2. Planilha base</h2>
</div>
<label class="dropzone" id="dzSheet">
  <i class="ph ph-upload-simple"></i>
  <span>Clique para selecionar ou arraste a Planilha (.xlsx, .csv)</span>
  <input type="file" id="sheetFile" accept=".xlsx,.xls,.csv" hidden>
</label>
<div class="grid" id="cfg" hidden>
<div><label for="sSheet">Aba</label><select id="sSheet"></select></div>
<div><label for="sKey">Coluna da chave de acesso</label><select id="sKey"></select></div>
<div><label for="sVal">Coluna do valor total</label><select id="sVal"></select></div>
<div><label for="sNum">Coluna Nº NF (opcional p/ match alternativo)</label><select id="sNum"></select></div>
<div><label for="sCobr">Coluna tipo de cobrança (Opcional)</label><select id="sCobr"></select></div>
<div><label for="tol">Tolerância no valor (R$)</label><input type="number" id="tol" value="0.01" step="0.01" min="0"></div>
</div>
<div class="info" id="shInfo">Nenhuma planilha lida.</div>
<div class="err" id="err" role="alert"></div>
<div class="row"><button id="run" disabled><i class="ph ph-play"></i> Identificar notas</button></div>
</section>

<section class="panel" id="out" hidden>
<div class="panel-header" style="justify-content: space-between;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <i class="ph ph-list-checks" style="color:var(--accent)"></i>
    <h2>3. Resultado</h2>
  </div>
  <div style="display: flex; gap: 8px;">
    <button class="sec" id="csv"><i class="ph ph-file-csv"></i> CSV</button>
    <button class="sec" id="pdf"><i class="ph ph-file-pdf"></i> PDF</button>
  </div>
</div>
<div class="err" id="outErr" style="margin-bottom: 16px;" hidden></div>
<div class="summary-cards" id="sumCards"></div>
<div class="table-controls">
  <div class="search-box">
    <i class="ph ph-magnifying-glass"></i>
    <input type="text" id="tSearch" placeholder="Buscar NF, chave ou arquivo...">
  </div>
  <div class="count" id="tCount"></div>
</div>
<div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="script.js"></script>
</body>
</html>
